<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>NeoLaw · Project saving verification</title><link rel="icon" href="/assets/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&family=Plus+Jakarta+Sans:wght@400;500;600;650;700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/modules/projects.css"><link rel="stylesheet" href="/modules/cases.css"><link rel="stylesheet" href="/modules/research-progress.css"><link rel="stylesheet" href="/modules/chat-article-panel.css"><link rel="stylesheet" href="/modules/answer-presentation.css"><link rel="stylesheet" href="/modules/library.css"><link rel="stylesheet" href="/modules/matrix.css"><link rel="stylesheet" href="/modules/screening.css"><link rel="stylesheet" href="/modules/screening-research.css"><link rel="stylesheet" href="/modules/screening-profile.css"><link rel="stylesheet" href="/modules/screening-reading-profile.css"><link rel="stylesheet" href="/modules/screening-portrait.css"><link rel="stylesheet" href="/modules/screening-workspace.css"><link rel="stylesheet" href="/modules/screening-chat.css"><link rel="stylesheet" href="/modules/screening-activity.css"><link rel="stylesheet" href="/modules/screening-settings.css"><link rel="stylesheet" href="/modules/screening-assessment.css"><style>body{display:block;height:auto;overflow:auto}#main{max-width:1260px;margin:auto;padding:12px 28px}.fixture-banner{background:#2b6b74;color:white;padding:10px 20px;text-align:center;font:12px Inter,sans-serif;position:sticky;top:0;z-index:20}.fixture-banner button{margin-left:15px;color:white;text-decoration:underline}</style></head><body><header class="fixture-banner">SYNTHETIC VERIFICATION · isolated test database · no client data or provider calls <a href="#/projects/project-demo-a" style="color:white;margin-left:16px">Open project</a></header><main id="main"></main><div id="toast" role="status"></div><script type="module">
import {render as screening} from '/modules/screening.js';
import {render as projects} from '/modules/projects.js';
import {createScreeningHistory} from '/modules/screening-history.js';
import {officialPortals} from '/modules/screening-view-model.js';
import {modal,toast,escape,icon} from '/core.js';
const at='2026-10-14T06:00:00.000Z',reportId='synthetic-project-browser-review';
const projectRows=[{id:'project-demo-a',name:'Acquisition review · Example',description:'Synthetic project for verification',type:'Corporate',updatedAt:at,chats:[],files:[]},{id:'project-demo-b',name:'Client onboarding · Example',description:'A second synthetic project',type:'General',updatedAt:at,chats:[],files:[]}];
const values=new Map([['projects',projectRows]]);
const storage={get:(key,fallback)=>structuredClone(values.get(key)??fallback),set:(key,value)=>{values.set(key,structuredClone(value));return true;}};
const history=createScreeningHistory({databaseName:'neolaw.synthetic.project-link-verification-v2',legacyStorage:storage});
await history.ready();
if(!history.get(reportId))await history.save({id:reportId,createdAt:at,query:{name:'Synthetic Example Client',type:'person',mode:'search',country:'Cyprus'},sourceSnapshots:[],matches:[],totalMatches:0,decisions:{},notes:'Retain this review note when linking a project.',requiresOfficial:true,research:{id:'synthetic-project-job',schemaVersion:7,mode:'search',status:'completed',officialStatus:'completed',officialChecks:officialPortals.map(p=>({...p,status:'completed',matchCount:0,candidates:[],checkedAt:at})),worldbank:{status:'completed',totalResults:0,candidates:[]},gleif:{status:'not_applicable'},opensanctions:{status:'not_configured'},phases:[]}});
const index={schemaVersion:1,records:[],sources:officialPortals.filter(p=>p.id!=='cy').map(p=>({...p,status:'available',indexReady:true,verifiedAt:at,retrievedAt:at,refreshHealth:{recentEvents:[],lastSuccessAt:at}}))};
let cleanup=()=>{};
const ctx={storage,screeningHistory:history,escape,icon,modal,toast,setHeader:()=>{},refreshSidebar:()=>{},startChat:()=>{},navigate:path=>{location.hash=path;},loadScreeningData:async()=>index,screeningIndexRequest:async()=>index,providerRequest:async()=>({configured:false}),researchRequest:async(path)=>{if(path==='/api/research/status')return {configured:false};throw Error('No provider calls in synthetic verification.');},screeningChatRequest:async()=>{throw Error('No AI calls in synthetic verification.');}};
function route(){cleanup();const [path,query='']=(location.hash.slice(1)||'/screening?report='+reportId).split('?');ctx.route=path.split('/').filter(Boolean);ctx.params=new URLSearchParams(query);cleanup=(ctx.route[0]==='projects'?projects:screening)(document.querySelector('#main'),ctx);}
document.addEventListener('click',event=>{const link=event.target.closest('[data-nav]');if(link){event.preventDefault();ctx.navigate(link.dataset.nav);}});
addEventListener('hashchange',route);route();
</script></body></html>
